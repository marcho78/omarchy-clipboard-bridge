[package]
name = "clipboard-bridge"
version = "0.2.0"
edition = "2024"
description = "Shared clipboard between an Omarchy (Hyprland) VM and its macOS host under Parallels Desktop"
license = "MIT"
repository = "https://github.com/marcho78/omarchy-clipboard-bridge"
rust-version = "1.85"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
hex = "0.4.3"
hmac = "0.13.0"
mdns-sd = "0.21.3"
png = "0.18.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["pipe", "fs"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6.1"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
